services:
  backend:
    build: ./backend
    volumes:
      - ./backend/:/app # Mount the backend directory to /app in the container
      - ./backend/data:/app/data
    expose:
      - "8000" # Espone solo alla rete interna Docker

  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # browser access (localhost:80)
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

# NOTE:
# Backend is mounted to /app in the container.
# DEACTIVATE in production: volumes: - ./backend/:/app