<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" author="yZempX">
	<title>Lupus in Fabula</title>
	<link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Metamorphous&family=Red+Rose:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Lupus in Fabula</h1>
    </header>

    <!-- Landing -->
    <div id="landing">
        <input type="text" id="game-selector" placeholder="Select active game" value="mockcopy" />
        <button id="open-game" onclick="loadGame()">Open Game</button>
        <button id="create-game" onclick="createGame()">Create Game</button>
    </div>
    
    <!-- Game -->
    <div id="game" class="hidden">
        
        <div id="game-info">
            <div id="local-title">
                <h2>Selected game:</h2>
                <p id="game-name"></p>
                <button id="back-to-landing" onclick="backToLanding()">Go back</button>
            </div>
        </div>
            
        <table class="leaderboard">
            <thead>
                <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">Player</th>
                    <th scope="col" class="th-score">Score</th>
                </tr>
            </thead>
            <tbody>
                <tr class="leaderboard-entry">
                    <td class="rank">1</td>
                    <td class="user">
                        <span class="username">Alice</span>
                    </td>
                    <td class="score">25,480</td>
                </tr>
            </tbody>
        </table>
    
        <fieldset id="control-panel">

            <legend>Next round:</legend>

            <div id="player-manager">
                
                <div id="add-player-container">
                    <button id="add-player" onclick="addPlayer()">
                        <svg viewBox="0 0 1024 1024" class="icon" version="1.1" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M512 288a32 32 0 0 0 32-32V192a32 32 0 0 0-64 0v64a32 32 0 0 0 32 32zM494.08 90.56a24.32 24.32 0 0 0 5.76 2.88l5.76 2.56h12.48a19.84 19.84 0 0 0 6.08-1.92 17.92 17.92 0 0 0 5.44-2.88l4.8-3.84A32 32 0 0 0 544 64a32 32 0 0 0-2.56-12.16 29.12 29.12 0 0 0-7.04-10.56l-4.8-3.84a17.92 17.92 0 0 0-5.44-2.88 19.52 19.52 0 0 0-6.08-2.56 27.2 27.2 0 0 0-12.48 0 20.16 20.16 0 0 0-5.76 1.92 24.32 24.32 0 0 0-5.76 2.88l-4.8 3.84a36.8 36.8 0 0 0-6.72 10.56 26.56 26.56 0 0 0-2.56 12.8 32 32 0 0 0 9.28 22.72zM960 480H544v-96a32 32 0 0 0-64 0v96H64a32 32 0 0 0 0 64h416v416a32 32 0 0 0 64 0V544h416a32 32 0 0 0 0-64z"></path></g></svg>
                    </button>
                </div>

                <div class="player-entry" data-player-id="123">
                    <span class="player-name">Alice</span>

                    <label for="active_123">Active:</label>
                    <input type="checkbox" id="active_123" name="players[123][active]" value="true" checked>
                    
                    <label for="role_123">Ruolo:</label>
                    <select id="role_123" name="players[123][role]">
                        <option value="0">Buono</option>
                        <option value="1">Lupo</option>
                        <option value="2">Folle</option>
                        <option value="3">Criceto mannaro (NON convertito)</option>
                        <option value="4">Criceto mannaro (convertito)</option>
                    </select>
                </div>

            </div>

            <fieldset id="round-winners">
                <legend>Round won by:</legend>

                <div>
                    <input type="radio" id="buoni" name="winners" value="0"/>
                    <label for="buoni">Buoni</label>
                </div>

                <div>
                    <input type="radio" id="cattivi" name="winners" value="1"/>
                    <label for="cattivi">Cattivi</label>
                </div>

                <div>
                    <input type="radio" id="folle" name="winners" value="2"/>
                    <label for="folle">Folle</label>
                </div>
                
                <div>
                    <input type="radio" id="patta" name="winners" value="3"/>
                    <label for="patta">Patta</label>
                </div>

            </fieldset>

            <button id="submit-round" onclick="updateRound()" disabled>
                Submit round
            </button>
        </div>
    </div>

    <footer>
        <p>
            AUTHOR: yZempX | <a href="https://github.com/yZemp/lupus-in-fabula/tree/main" target="_blank">GitHub</a>
        </p>
    </footer>

    <script src="logic.js"></script>
</body>
</html>
